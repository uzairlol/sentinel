name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --extra langchain --extra langgraph
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --extra langchain --extra langgraph
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --extra langchain --extra langgraph
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: uv run pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  integration-postgres:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --volume "${{ github.workspace }}/deploy/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --extra postgres
      - name: Run Postgres adapter integration tests
        # Coverage is on here, not just tests: this is the only job that can
        # execute the Postgres store, so it is also the only one that can gate
        # its coverage. pyproject.toml omits those files from the offline gate
        # because the offline gate has no database; the two configs together
        # mean no shipped line escapes a threshold. --no-cov keeps pytest-cov
        # from writing its own data file over the outer `coverage run`.
        run: |
          uv run coverage run -m pytest \
            tests/integration/ tests/contract/ tests/e2e/test_cli_replay_postgres.py -q --no-cov
          uv run coverage report
        env:
          COVERAGE_RCFILE: .coveragerc.postgres
          SENTINEL_TEST_POSTGRES_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
          SENTINEL_STORE_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
          SENTINEL_ROLE_WRITER_DSN: postgresql://sentinel_writer:writer_dev@localhost:5432/sentinel_test
          SENTINEL_ROLE_READER_DSN: postgresql://sentinel_reader:reader_dev@localhost:5432/sentinel_test
          # without this the reviewer least-privilege test skips silently, and
          # the role ADR-0012 depends on would ship unverified
          SENTINEL_ROLE_REVIEWER_DSN: postgresql://sentinel_reviewer:reviewer_dev@localhost:5432/sentinel_test
      - name: Upload Postgres coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres
          path: .coverage

  load:
    name: Load (1M-event losslessness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --extra postgres
      - name: Run 1M-event losslessness gate
        run: uv run pytest tests/perf/test_losslessness.py -q --no-cov
        env:
          SENTINEL_TEST_POSTGRES_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
          SENTINEL_STORE_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel_test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src
      - name: pip-audit
        run: uv run pip-audit
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: Build wheel + sdist
        run: uv build
      - name: Verify wheel installs in a clean venv
        run: |
          uv venv --python 3.12 /tmp/verify-venv
          uv pip install --python /tmp/verify-venv dist/*.whl
          /tmp/verify-venv/bin/sentinel --version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --group docs
      - run: uv run mkdocs build --strict
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
