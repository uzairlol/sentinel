[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sdk"
version = "0.0.2"
description = "Runtime safety instrumentation for autonomous LLM agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Uzair Arif", email = "uarif2093@gmail.com" }]
keywords = [
    "ai-safety",
    "llm",
    "agents",
    "observability",
    "evaluation",
    "guardrails",
    "provenance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
sqlite = ["aiosqlite>=0.20"]
http = ["httpx>=0.27"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.1"]
embeddings = ["numpy>=1.26"]
all = [
    "sentinel-sdk[postgres,sqlite,http,api,langchain,langgraph,embeddings]",
]

[project.scripts]
sentinel = "sentinel._cli:main"

[project.urls]
Homepage = "https://github.com/uzairlol/sentinel"
Documentation = "https://github.com/uzairlol/sentinel#readme"
Issues = "https://github.com/uzairlol/sentinel/issues"
Changelog = "https://github.com/uzairlol/sentinel/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "python-semantic-release>=9.8",
    "respx>=0.21",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "I",      # isort
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S101"]
"docs/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

# ---------------------------------------------------------------------------
# mypy — static typing (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=sentinel",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring external services",
    "property: property-based tests",
    "contract: schema/interface compatibility tests",
    "adversarial: known-good/known-bad evaluator fixtures",
    "e2e: end-to-end pipeline tests",
    "perf: performance budget tests",
]

[tool.coverage.run]
source = ["src/sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# bandit — security linting
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
targets = ["src"]

# ---------------------------------------------------------------------------
# python-semantic-release
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
commit_parser = "conventional"
upload_to_pypi = false
upload_to_release = true
build_command = "uv build"

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false
