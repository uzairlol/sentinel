[alembic]
# The migration script tree (async env in alembic/env.py).
script_location = alembic
prepend_sys_path = .
# Placeholder only: runtime DSN comes from SENTINEL_STORE_DSN (or
# SENTINEL_TEST_POSTGRES_DSN), never from this file.
sqlalchemy.url = postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
